spring.application.name=flfp

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/flfpdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool — tuned for local dev workload
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# Disable SQL logging in default profile for performance (enable only for debug)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HTTP Response Compression — reduces JSON payload size by ~70%
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/html,text/css,text/plain
server.compression.min-response-size=1024
